        document.documentElement.setAttribute('data-theme', 'dark');
      }

  <script>
    (function () {
      var t = document.getElementById('theme-toggle');
      var r = document.documentElement;
      function dark() { return r.getAttribute('data-theme') === 'dark'; }
      function sync() {
        t.textContent = dark() ? '☀' : '☾';
        t.setAttribute('aria-label', dark() ? 'Switch to light mode' : 'Switch to dark mode');
      }
      sync();
      t.addEventListener('click', function () {
        if (dark()) { r.removeAttribute('data-theme'); localStorage.setItem('theme', 'light'); }
        else { r.setAttribute('data-theme', 'dark'); localStorage.setItem('theme', 'dark'); }
        sync();
      });
    })();
  </script>
